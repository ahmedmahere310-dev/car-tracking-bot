<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم - نظام تتبع الأسطول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0A0F1C;
    --panel: #121A2E;
    --line: #223050;
    --amber: #F0B429;
    --cyan: #38BDF8;
    --text: #E7ECF6;
    --muted: #7C8AA8;
    --ok: #3DD9A5;
    --danger: #F0574F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Tajawal', sans-serif; min-height: 100vh;
  }
  
  header {
    padding: 20px 28px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(18,26,46,0.8), transparent);
  }
  header h1 { font-family: 'Cairo', sans-serif; font-weight: 900; font-size: 24px; margin: 0; }
  
  nav {
    display: flex; gap: 10px; padding: 10px 28px; flex-wrap: wrap;
  }
  nav button {
    padding: 8px 14px; background: var(--panel); border: 1px solid var(--line);
    color: var(--text); border-radius: 6px; cursor: pointer; font-family: 'Tajawal';
    transition: 0.2s;
  }
  nav button.active { background: var(--cyan); color: var(--bg); }
  nav button:hover { border-color: var(--cyan); }

  main { padding: 20px 28px; max-width: 1400px; margin: 0 auto; }

  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .kpi {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 16px; text-align: center;
  }
  .kpi .label { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .kpi .value { font-size: 28px; font-weight: 700; }
  .kpi.amber .value { color: var(--amber); }
  .kpi.cyan .value { color: var(--cyan); }
  .kpi.ok .value { color: var(--ok); }
  .kpi.danger .value { color: var(--danger); }

  .section { margin-bottom: 20px; }
  .section h2 { font-family: 'Cairo', sans-serif; font-size: 16px; margin: 0 0 12px; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }

  table {
    width: 100%; border-collapse: collapse; font-size: 13px;
  }
  th { text-align: right; color: var(--muted); font-weight: 500; padding: 10px; border-bottom: 1px solid var(--line); }
  td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.04); }

  .empty { color: var(--muted); text-align: center; padding: 30px; }
  .chart-wrap { height: 250px; margin-bottom: 20px; }

  .branch-card {
    background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px; margin-bottom: 12px;
  }
  .branch-card strong { color: var(--cyan); }
  .branch-card .count { color: var(--amber); font-weight: 700; }

  .asset-item {
    padding: 10px; border-bottom: 1px solid var(--line);
    display: grid; grid-template-columns: 100px 1fr 80px; gap: 10px;
    align-items: center;
  }
  .asset-code { color: var(--amber); font-weight: 700; font-family: monospace; }
  .asset-type { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>

<header>
  <h1>🚦 لوحة التحكم - نظام تتبع الأسطول</h1>
</header>

<nav>
  <button class="tab-btn active" data-tab="overview">📊 نظرة عامة</button>
  <button class="tab-btn" data-tab="branches">🏢 الفروع</button>
  <button class="tab-btn" data-tab="assets">🚗 الأصول</button>
  <button class="tab-btn" data-tab="stats">📈 الإحصائيات</button>
  <button class="tab-btn" data-tab="requests">📋 الطلبات</button>
</nav>

<main>

  <!-- نظرة عامة -->
  <div id="overview" class="tab-content">
    <div class="kpi-row">
      <div class="kpi amber">
        <div class="label">إجمالي الأصول</div>
        <div class="value" id="kpiTotal">0</div>
      </div>
      <div class="kpi cyan">
        <div class="label">النقلات المكتملة</div>
        <div class="value" id="kpiCompleted">0</div>
      </div>
      <div class="kpi ok">
        <div class="label">الموافق عليها</div>
        <div class="value" id="kpiApproved">0</div>
      </div>
      <div class="kpi danger">
        <div class="label">المعلّقة</div>
        <div class="value" id="kpiPending">0</div>
      </div>
    </div>

    <div class="section">
      <h2>توزيع الأصول على الفروع</h2>
      <div class="panel" id="overviewPanel"></div>
    </div>
  </div>

  <!-- الفروع -->
  <div id="branches" class="tab-content" style="display:none;">
    <div class="section">
      <h2>الفروع والمعدات</h2>
      <div class="panel" id="branchesPanel"></div>
    </div>
  </div>

  <!-- الأصول -->
  <div id="assets" class="tab-content" style="display:none;">
    <div class="section">
      <h2>قائمة الأصول الكاملة</h2>
      <div class="panel">
        <table id="assetsTable">
          <thead><tr><th>الكود</th><th>الاسم</th><th>الماركة</th><th>الفرع</th><th>النوع</th><th>النقلات</th></tr></thead>
          <tbody id="assetsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- الإحصائيات -->
  <div id="stats" class="tab-content" style="display:none;">
    <div class="kpi-row">
      <div class="kpi cyan">
        <div class="label">إجمالي النقلات</div>
        <div class="value" id="statTotal">0</div>
      </div>
      <div class="kpi ok">
        <div class="label">الموافق عليها</div>
        <div class="value" id="statApproved">0</div>
      </div>
      <div class="kpi danger">
        <div class="label">المرفوضة</div>
        <div class="value" id="statRejected">0</div>
      </div>
    </div>

    <div class="section">
      <h2>أكثر الفروع نقلات</h2>
      <div class="panel" id="topBranchesPanel"></div>
    </div>

    <div class="section">
      <h2>أكثر المسارات نشاطًا</h2>
      <div class="panel" id="topRoutesPanel"></div>
    </div>
  </div>

  <!-- الطلبات -->
  <div id="requests" class="tab-content" style="display:none;">
    <div class="section">
      <h2>الطلبات المعلّقة</h2>
      <div class="panel" id="requestsPanel"></div>
    </div>
  </div>

</main>

<script>
let allData = {};

async function loadAllData() {
  try {
    const res = await fetch('/api/dashboard-data');
    allData = await res.json();
    console.log('✅ البيانات اتحملت');
    loadOverview();
  } catch (err) {
    console.error('❌ خطأ:', err);
  }
}

function loadOverview() {
  const assets = Object.values(allData.assets || {});
  const requests = Object.values(allData.requests || {});
  const branches = allData.branches || {};

  document.getElementById('kpiTotal').textContent = assets.length;
  document.getElementById('kpiCompleted').textContent = requests.filter(r => r.status === 'approved').length;
  document.getElementById('kpiApproved').textContent = requests.filter(r => r.status === 'approved').length;
  document.getElementById('kpiPending').textContent = requests.filter(r => r.status === 'pending').length;

  const branchStats = {};
  assets.forEach(a => {
    branchStats[a.branch] = (branchStats[a.branch] || 0) + 1;
  });

  const html = Object.entries(branchStats)
    .sort((a, b) => b[1] - a[1])
    .map(([code, count]) => `
      <div class="branch-card">
        <strong>${branches[code]?.name || code}</strong>
        <div class="count">${count} أصل</div>
      </div>
    `).join('');

  document.getElementById('overviewPanel').innerHTML = html || '<div class="empty">لا توجد بيانات</div>';
}

function loadBranches() {
  const branches = allData.branches || {};
  const assets = Object.values(allData.assets || {});

  const html = Object.entries(branches)
    .map(([code, branch]) => {
      const branchAssets = assets.filter(a => a.branch === code);
      return `
        <div class="branch-card">
          <strong>${branch.name} (${code})</strong>
          <div style="font-size: 12px; color: var(--muted); margin-top: 8px;">
            ${branchAssets.length} أصل | النقلات الخارجة: ${branch.totalOutgoing || 0} | الوارة: ${branch.totalIncoming || 0}
          </div>
          <div style="margin-top: 10px;">
            ${branchAssets.slice(0, 5).map(a => `<div class="asset-item"><span class="asset-code">${a.code}</span><span>${a.name}</span><span class="asset-type">${a.type}</span></div>`).join('')}
          </div>
        </div>
      `;
    }).join('');

  document.getElementById('branchesPanel').innerHTML = html || '<div class="empty">لا توجد فروع</div>';
}

function loadAssets() {
  const assets = Object.values(allData.assets || {});
  
  const tbody = document.getElementById('assetsBody');
  tbody.innerHTML = assets
    .slice(0, 200)
    .map(a => `
      <tr>
        <td><strong>${a.code}</strong></td>
        <td>${a.name}</td>
        <td>${a.brand || '-'}</td>
        <td>${a.branch}</td>
        <td>${a.type === 'vehicle' ? '🚗 سيارة' : '⚙️ معدة'}</td>
        <td>${a.transferCount || 0}</td>
      </tr>
    `).join('') || '<tr><td colspan="6" class="empty">لا توجد أصول</td></tr>';
}

async function loadStats() {
  try {
    const res = await fetch('/api/stats');
    const stats = await res.json();

    document.getElementById('statTotal').textContent = stats.totalTransfers;
    document.getElementById('statApproved').textContent = stats.totalApproved;
    document.getElementById('statRejected').textContent = stats.totalRejected;

    const topBranchesHtml = stats.topBranches
      .map(b => `
        <div class="branch-card">
          <strong>${b.name || b.branch}</strong>
          <div class="count">${b.transferCount} نقلة</div>
        </div>
      `).join('');
    document.getElementById('topBranchesPanel').innerHTML = topBranchesHtml || '<div class="empty">لا توجد بيانات</div>';

    const topRoutesHtml = stats.topRoutes
      .map(r => `
        <div class="branch-card">
          <strong>${r.fromName || r.from} → ${r.toName || r.to}</strong>
          <div class="count">${r.count} نقلة</div>
        </div>
      `).join('');
    document.getElementById('topRoutesPanel').innerHTML = topRoutesHtml || '<div class="empty">لا توجد بيانات</div>';
  } catch (err) {
    console.error('❌ خطأ:', err);
  }
}

function loadRequests() {
  const requests = Object.values(allData.requests || {});
  const assets = allData.assets || {};

  const pending = requests.filter(r => r.status === 'pending');
  const html = pending
    .map(r => `
      <div class="branch-card">
        <strong>الطلب: ${r.id}</strong>
        <div style="font-size: 12px; color: var(--muted); margin-top: 4px;">
          المعدة: <strong>${assets[r.asset_id]?.name || r.asset_id}</strong><br>
          من <strong>${r.from}</strong> إلى <strong>${r.to}</strong><br>
          السبب: ${r.reason}<br>
          المرحلة: ${r.current_stage}/4
        </div>
      </div>
    `).join('');

  document.getElementById('requestsPanel').innerHTML = html || '<div class="empty">لا توجد طلبات معلّقة</div>';
}

// Tab switching
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
    document.getElementById(this.dataset.tab).style.display = 'block';

    if (this.dataset.tab === 'branches') loadBranches();
    if (this.dataset.tab === 'assets') loadAssets();
    if (this.dataset.tab === 'stats') loadStats();
    if (this.dataset.tab === 'requests') loadRequests();
  });
});

// Load on start
loadAllData();
setInterval(loadAllData, 15000);
</script>

</body>
</html>
