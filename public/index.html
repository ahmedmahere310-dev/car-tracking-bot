<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم - نظام تتبع الأسطول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0A0F1C;
    --panel: #121A2E;
    --line: #223050;
    --amber: #F0B429;
    --cyan: #38BDF8;
    --text: #E7ECF6;
    --muted: #7C8AA8;
    --ok: #3DD9A5;
    --danger: #F0574F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Tajawal', sans-serif; min-height: 100vh;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }
  
  header {
    padding: 20px 28px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(18,26,46,0.8), transparent);
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px;
  }
  header h1 { font-family: 'Cairo', sans-serif; font-weight: 900; font-size: 24px; margin: 0; }
  
  nav {
    display: flex; gap: 10px; padding: 10px 28px; flex-wrap: wrap;
  }
  nav button {
    padding: 8px 14px; background: var(--panel); border: 1px solid var(--line);
    color: var(--text); border-radius: 6px; cursor: pointer; font-family: 'Tajawal';
    transition: 0.2s;
  }
  nav button.active { background: var(--cyan); color: var(--bg); border-color: var(--cyan); }
  nav button:hover { border-color: var(--cyan); }

  main { padding: 20px 28px; max-width: 1400px; margin: 0 auto; }

  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .kpi {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 16px; text-align: center;
  }
  .kpi .label { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .kpi .value { font-size: 28px; font-weight: 700; }
  .kpi.amber .value { color: var(--amber); }
  .kpi.cyan .value { color: var(--cyan); }
  .kpi.ok .value { color: var(--ok); }
  .kpi.danger .value { color: var(--danger); }

  .section { margin-bottom: 20px; }
  .section h2 { font-family: 'Cairo', sans-serif; font-size: 16px; margin: 0 0 12px; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }

  table {
    width: 100%; border-collapse: collapse; font-size: 13px;
  }
  th { text-align: right; color: var(--muted); font-weight: 500; padding: 10px; border-bottom: 1px solid var(--line); }
  td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.04); }

  .empty { color: var(--muted); text-align: center; padding: 30px; }
  .chart-wrap { height: 250px; margin-bottom: 20px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>🚦 لوحة التحكم</h1>
  </div>
</header>

<nav>
  <button class="tab-btn active" data-tab="overview">نظرة عامة</button>
  <button class="tab-btn" data-tab="branches">الفروع</button>
  <button class="tab-btn" data-tab="assets">الأصول</button>
  <button class="tab-btn" data-tab="requests">الطلبات</button>
</nav>

<main>

  <div id="overview" class="tab-content">
    <div class="kpi-row">
      <div class="kpi amber">
        <div class="label">إجمالي الأصول</div>
        <div class="value mono" id="kpiTotal">--</div>
      </div>
      <div class="kpi cyan">
        <div class="label">الطلبات الكاملة</div>
        <div class="value mono" id="kpiTransfers">--</div>
      </div>
      <div class="kpi ok">
        <div class="label">المتاحة</div>
        <div class="value mono" id="kpiAvailable">--</div>
      </div>
      <div class="kpi danger">
        <div class="label">المعلّقة</div>
        <div class="value mono" id="kpiPending">--</div>
      </div>
    </div>

    <div class="section">
      <h2>توزيع الفروع</h2>
      <div class="panel">
        <table id="branchTable">
          <thead><tr><th>الفرع</th><th>الأصول</th></tr></thead>
          <tbody id="branchBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="branches" class="tab-content" style="display:none;">
    <div class="section">
      <h2>الفروع والمعدات</h2>
      <div class="panel" id="branchesPanel"></div>
    </div>
  </div>

  <div id="assets" class="tab-content" style="display:none;">
    <div class="section">
      <h2>قائمة الأصول</h2>
      <div class="panel">
        <table id="assetsTable">
          <thead><tr><th>الكود</th><th>الاسم</th><th>الماركة</th><th>الفرع</th><th>النوع</th></tr></thead>
          <tbody id="assetsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="requests" class="tab-content" style="display:none;">
    <div class="section">
      <h2>الطلبات المعلّقة</h2>
      <div class="panel" id="requestsPanel"></div>
    </div>
  </div>

</main>

<script>
let allData = {};

async function loadData() {
  try {
    const res = await fetch('/api/dashboard-data');
    allData = await res.json();
    console.log('✅ البيانات اتحملت:', allData);
    loadOverview();
  } catch (err) {
    console.error('❌ خطأ:', err);
    document.querySelector('#overview').innerHTML = '<div class="empty">خطأ في تحميل البيانات</div>';
  }
}

function loadOverview() {
  const assets = allData.assets || {};
  const requests = allData.requests || {};
  const branches = allData.branches || {};

  const totalAssets = Object.keys(assets).length;
  const available = Object.values(assets).filter(a => a.status === 'available').length;
  const pending = Object.values(requests).filter(r => r.status === 'pending').length;
  const completed = Object.values(requests).filter(r => r.status === 'approved').length;

  document.getElementById('kpiTotal').textContent = totalAssets;
  document.getElementById('kpiTransfers').textContent = completed;
  document.getElementById('kpiAvailable').textContent = available;
  document.getElementById('kpiPending').textContent = pending;

  // جدول الفروع
  const branchStats = {};
  Object.values(assets).forEach(a => {
    branchStats[a.branch] = (branchStats[a.branch] || 0) + 1;
  });

  const tbody = document.getElementById('branchBody');
  tbody.innerHTML = Object.entries(branchStats)
    .sort((a, b) => b[1] - a[1])
    .map(([code, count]) => `
      <tr>
        <td>${branches[code]?.name || code}</td>
        <td>${count}</td>
      </tr>
    `).join('') || '<tr><td colspan="2" class="empty">لا توجد بيانات</td></tr>';
}

function loadBranches() {
  const assets = allData.assets || {};
  const branches = allData.branches || {};

  const html = Object.entries(branches).map(([code, branch]) => {
    const count = Object.values(assets).filter(a => a.branch === code).length;
    return `
      <div style="margin-bottom: 20px; padding: 12px; border: 1px solid var(--line); border-radius: 8px;">
        <strong>${branch.name} (${code})</strong>
        <div style="color: var(--muted); font-size: 12px; margin-top: 4px;">${count} أصل</div>
      </div>
    `;
  }).join('');

  document.getElementById('branchesPanel').innerHTML = html || '<div class="empty">لا توجد فروع</div>';
}

function loadAssets() {
  const assets = allData.assets || {};
  
  const tbody = document.getElementById('assetsBody');
  tbody.innerHTML = Object.values(assets)
    .slice(0, 100)
    .map(a => `
      <tr>
        <td class="mono">${a.code}</td>
        <td>${a.name}</td>
        <td>${a.brand || '-'}</td>
        <td>${a.branch}</td>
        <td>${a.type === 'vehicle' ? '🚗 سيارة' : '⚙️ معدة'}</td>
      </tr>
    `).join('') || '<tr><td colspan="5" class="empty">لا توجد أصول</td></tr>';
}

function loadRequests() {
  const requests = allData.requests || {};
  const assets = allData.assets || {};

  const html = Object.entries(requests)
    .filter(([_, r]) => r.status === 'pending')
    .map(([id, r]) => `
      <div style="margin-bottom: 12px; padding: 12px; border-right: 3px solid var(--amber); background: rgba(255,255,255,0.03); border-radius: 4px;">
        <strong>الطلب #${id}</strong>
        <div style="font-size: 12px; color: var(--muted); margin-top: 4px;">
          المعدة: ${assets[r.asset_id]?.name || r.asset_id}<br>
          من ${r.from_branch} إلى ${r.to_branch} | السبب: ${r.reason}
        </div>
      </div>
    `).join('');

  document.getElementById('requestsPanel').innerHTML = html || '<div class="empty">لا توجد طلبات معلّقة</div>';
}

// Tab switching
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
    document.getElementById(this.dataset.tab).style.display = 'block';

    if (this.dataset.tab === 'branches') loadBranches();
    if (this.dataset.tab === 'assets') loadAssets();
    if (this.dataset.tab === 'requests') loadRequests();
  });
});

// Load on start
loadData();
setInterval(loadData, 15000);
</script>

</body>
</html>
